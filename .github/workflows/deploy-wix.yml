name: Deploy to Wix

# Every push to main that changes the website is checked here. When the
# WIX_API_KEY secret exists, the run also releases dist/ to the Wix Headless
# site named in wix.config.json; without it, releases are made with the Wix
# CLI after pushing (see 'Hosting on Wix' in README.md).
on:
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - 'wix.config.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-wix.yml'
  workflow_dispatch:

permissions:
  contents: read

# One release at a time; a newer push waits for the running one to finish.
concurrency:
  group: wix-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install the Wix CLI
        run: npm ci --no-audit --no-fund

      - name: Run project checks
        run: node --test tests/*.test.mjs

      - name: Check the release size
        run: |
          files=$(find dist -type f | wc -l)
          echo "dist/ holds $files files, $(du -sh dist | cut -f1)."
          if [ "$files" -gt 5000 ]; then
            echo "::error::A Wix release can include at most 5,000 static files; dist/ has $files."
            exit 1
          fi

      - name: Log in to Wix
        id: login
        env:
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
        run: |
          if [ -z "$WIX_API_KEY" ]; then
            echo "::notice::No WIX_API_KEY secret, so this run checks the site but doesn't release it. Releases are made with the Wix CLI (see 'Hosting on Wix' in README.md)."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npx wix login --api-key "$WIX_API_KEY"
          echo "release=true" >> "$GITHUB_OUTPUT"

      - name: Release to Wix
        if: steps.login.outputs.release == 'true'
        env:
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          subject=$(printf '%s' "${HEAD_MESSAGE:-Manual release}" | head -n 1 | cut -c 1-200)
          npx wix release --version-type minor --comment "${GITHUB_SHA::7} ${subject}"
